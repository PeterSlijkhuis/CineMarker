# Actions > Release > Run workflow. Leave the version empty to bump the patch number of
# the last release (0.1.0 -> 0.1.1), or type one for a bigger change. This tests and builds
# the plugin, then creates release vX.Y.Z with cinemarker_X.Y.Z.0.zip and manifest.json.
# Jellyfin reads the manifest from
# https://github.com/PeterSlijkhuis/CineMarker/releases/latest/download/manifest.json
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version like 0.2.0. Empty = last release + 0.0.1 (first release is 0.1.0)
        required: false
      changelog:
        description: What changed
        required: false
        default: Bug fixes and improvements.

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_INPUT: ${{ inputs.version }}
      CHANGELOG: ${{ inputs.changelog }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Pick version
        run: |
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            LAST=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
            if [ -z "$LAST" ]; then
              VERSION=0.1.0
            else
              IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
              VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            fi
          fi
          echo "TAG=v${VERSION#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/Jellyfin.Plugin.CineMarker.Tests

      - name: Build zip and manifest
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like v1.2.3, got $TAG"; exit 1; }
          VERSION="${TAG#v}.0"
          dotnet build src/Jellyfin.Plugin.CineMarker -c Release -o out -p:AssemblyVersion=$VERSION -p:FileVersion=$VERSION
          ZIP="cinemarker_$VERSION.zip"
          zip -j "$ZIP" out/Jellyfin.Plugin.CineMarker.dll
          jq -n \
            --arg version "$VERSION" \
            --arg changelog "${CHANGELOG:-Release $TAG}" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/$ZIP" \
            --arg checksum "$(md5sum "$ZIP" | cut -d' ' -f1)" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '[{
              guid: "81dd951c-751d-4736-b6a7-aa848a4cd741",
              name: "CineMarker",
              description: "Replaces movie chapters with emoji markers from CineMarkerDB.",
              overview: "Emoji chapter markers for movies",
              owner: "PeterSlijkhuis",
              category: "Metadata",
              versions: [{
                version: $version,
                changelog: $changelog,
                targetAbi: "12.1.0.0",
                sourceUrl: $url,
                checksum: $checksum,
                timestamp: $timestamp
              }]
            }]' > manifest.json
          cat manifest.json

      - name: Create release
        run: gh release create "$TAG" cinemarker_*.zip manifest.json --target "$GITHUB_SHA" --title "$TAG" --notes "${CHANGELOG:-Release $TAG}"
